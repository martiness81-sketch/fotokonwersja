name: Wysylanie strony na OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zainstaluj lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Wyslij pliki na OVH przez SFTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "fotokou,$FTP_PASSWORD" sftp://ftp.cluster129.hosting.ovh.net -e "set sftp:auto-confirm yes; mirror -R --verbose -x '^\\.git' -x '^README\\.md$' ./ www/; rm -r -f www/.git; rm -r -f www/.github; bye"
